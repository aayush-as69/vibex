name: Package VibeX Shield

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify product
        run: |
          npm test
          npm run guard
          npm run lint
          npm run build

      - name: Create product archive
        run: |
          mkdir -p dist
          zip -r "dist/VibeX-Shield-\${GITHUB_SHA::7}.zip" . \
            -x ".git/*" "node_modules/*" ".next/*" ".vercel/*" "dist/*" "coverage/*"

      - name: Upload product ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VibeX-Shield-\${{ github.sha }}
          path: dist/VibeX-Shield-*.zip
          if-no-files-found: error
          retention-days: 30
