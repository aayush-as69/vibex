name: Package VibeX Shield

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify complete product
        run: |
          npm test
          npm run guard
          npm run lint
          npm run build
          npm run shield -- doctor

      - name: Create source product ZIP
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/VibeX-Shield-${GITHUB_SHA::7}.zip HEAD

      - name: Upload product ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VibeX-Shield-${{ github.sha }}
          path: dist/VibeX-Shield-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/VibeX-Shield-*.zip
